[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Evidence-grounded drawing intelligence for OpenLPBF v2"
requires-python = ">=3.11"
dependencies = [
  "pymupdf",
  "rapidfuzz",
  "openai",
  "anthropic",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
